<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joc de Mamífers</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f0f8ff;
    padding: 20px;
  }
  .animal-btn {
    padding: 15px 30px;
    margin: 10px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 10px;
    border: none;
    background-color: #87ceeb;
    color: white;
  }
  .animal-btn:hover {
    background-color: #4682b4;
  }
  #result {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>Endevina el mamífer!</h1>
<p id="round">Ronda 1 de 5</p>

<div>
  <button class="animal-btn" id="animal1"></button>
  <button class="animal-btn" id="animal2"></button>
</div>

<p id="result"></p>
<p id="score">Puntuació: 0</p>

<script>
const rounds = [
  { a1: "Tortuga", a2: "Gos", mammal: "Gos" },
  { a1: "Cocodril", a2: "Ratolí", mammal: "Ratolí" },
  { a1: "Pingüí", a2: "Dofí", mammal: "Dofí" },
  { a1: "Serp", a2: "Elefant", mammal: "Elefant" },
  { a1: "Àguila", a2: "Cangur", mammal: "Cangur" }
];

let currentRound = 0;
let score = 0;

function loadRound() {
  document.getElementById("round").textContent = `Ronda ${currentRound + 1} de ${rounds.length}`;
  document.getElementById("animal1").textContent = rounds[currentRound].a1;
  document.getElementById("animal2").textContent = rounds[currentRound].a2;
  document.getElementById("result").textContent = "";
}

function chooseAnimal(choice) {
  const round = rounds[currentRound];
  if (choice === round.mammal) {
    score++;
    document.getElementById("result").textContent = "Correcte! 🐾";
  } else {
    document.getElementById("result").textContent = `Incorrecte! Era ${round.mammal}.`;
  }
  document.getElementById("score").textContent = `Puntuació: ${score}`;
  currentRound++;
  if (currentRound < rounds.length) {
    setTimeout(loadRound, 1500);
  } else {
    setTimeout(() => {
      document.getElementById("result").textContent = `Joc acabat! Puntuació final: ${score}/${rounds.length}`;
      document.getElementById("animal1").style.display = "none";
      document.getElementById("animal2").style.display = "none";
      document.getElementById("round").style.display = "none";
    }, 1500);
  }
}

document.getElementById("animal1").addEventListener("click", () => chooseAnimal(rounds[currentRound].a1));
document.getElementById("animal2").addEventListener("click", () => chooseAnimal(rounds[currentRound].a2));

loadRound();
</script>

</body>
</html>
